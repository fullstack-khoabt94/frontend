name: Deploy
on:
  push: { branches: [main] }

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - id: push
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/tasklog-frontend:${{ github.sha }}
          docker buildx build --platform linux/arm64 -t $IMG --push .
          echo "image=$IMG" >> $GITHUB_OUTPUT

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: td
        with:
          task-definition: ${{ steps.td.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - run: curl -f https://app.khoatienbui94.click/login
