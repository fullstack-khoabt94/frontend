server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary       on;
    gzip_types      text/plain
                    text/css
                    application/javascript
                    application/json
                    image/svg+xml;

    # ALB gọi endpoint này mỗi 30 giây
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Tên file đã có hash của Vite → cache vĩnh viễn
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html thì ngược lại: không bao giờ cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — thiếu dòng này thì F5 ở /tasks trả 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}